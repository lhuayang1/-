<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 · 날씨와 주요 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f1; --card:#ffffff; --ink:#16232f; --muted:#5b6874; --line:#dfe3e0;
  --link:#1f5fa8; --focus:#1f5fa8;
  --serif:"Gowun Batang","Noto Serif KR","Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171d; --card:#18212a; --ink:#e8eef3; --muted:#9aa8b4; --line:#27333d; --link:#7db4ee; --focus:#7db4ee;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:color-mix(in srgb,var(--tint,#cfd8e0) 16%,var(--bg));transition:background .6s;color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 48px}

/* header */
/* top scene banner (scrolls away with the page) */
.scene{position:relative;display:flex;flex-direction:column;min-height:300px;margin-bottom:22px;border-radius:22px;color:var(--scene-ink,#10263a);--scene-a:#cfd8e0;--scene-b:#eef2f5}
.scene-bg{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,var(--scene-a),var(--scene-b));transition:background .5s}
.scene-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene-foot{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px;padding:0 26px 18px;margin-top:auto}
.scene-cap{font-family:var(--serif);font-size:1.15rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 11px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);background:color-mix(in srgb,var(--scene-b) 45%,transparent);color:inherit;cursor:pointer;font-size:.8rem}
.chip[aria-pressed="true"]{background:var(--scene-ink,#10263a);color:var(--scene-b);border-color:transparent}
header.top{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start;justify-content:space-between;padding:24px 26px 0}
.brand h1{font-family:var(--serif);font-size:2rem;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;opacity:.8;font-size:.95rem}
.finder{position:relative;display:flex;gap:8px;flex:1 1 320px;max-width:460px}
.finder input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.btn{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--bg)}
.results small{color:var(--muted)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.stack{display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-family:var(--serif);font-size:1.15rem;margin:0 0 12px;font-weight:700}

/* hero */
.hero{border-radius:22px;padding:26px 26px 22px;color:var(--hero-ink,#10263a);background:linear-gradient(165deg,var(--sky-a,#6fb1e8),var(--sky-b,#dff0fb));transition:background .4s}
.hero .place{font-size:1rem;font-weight:500;opacity:.9}
.hero .now{display:flex;align-items:center;gap:14px;margin:6px 0 2px}
.hero .temp{font-family:var(--serif);font-size:5.4rem;line-height:1;font-weight:700;letter-spacing:-.03em}
.hero .temp sup{font-size:1.6rem;vertical-align:top;position:relative;top:.55em;margin-left:2px;font-weight:400}
.hero .cond{font-size:1.25rem;font-weight:500}
.hero .range{opacity:.85;font-size:.95rem}
.hero .say{margin:16px 0 0;padding-top:14px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);font-size:1rem;max-width:34em}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
@media (max-width:480px){.facts{grid-template-columns:repeat(2,1fr)}.hero .temp{font-size:4.4rem}}
.facts div{font-size:.8rem;opacity:.9}
.facts b{display:block;font-size:1.05rem;font-weight:700;opacity:1}
.stamp{margin-top:14px;font-size:.78rem;opacity:.75}

/* air */
.air{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.air .item{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.air .lab{color:var(--muted);font-size:.85rem}
.air .val{font-size:1.4rem;font-weight:700}
.air .val small{font-size:.8rem;color:var(--muted);font-weight:400}
.air .grade{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* hourly */
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.hour{flex:0 0 62px;text-align:center;padding:8px 2px;border-radius:12px;scroll-snap-align:start}
.hour:first-child{background:var(--bg)}
.hour .t{font-size:.8rem;color:var(--muted)}
.hour .d{font-weight:700;margin-top:2px}
.hour .p{font-size:.75rem;color:#3b82c4;min-height:1.1em}
.hour svg{display:block;margin:4px auto}

/* daily */
.day{display:grid;grid-template-columns:44px 30px 1fr 90px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .n{font-weight:500}
.day .pp{font-size:.75rem;color:#3b82c4}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#5aa4dd,#f0a23a)}
.day .lo,.day .hi{font-variant-numeric:tabular-nums}
.day .temps{display:flex;justify-content:space-between;font-size:.9rem}
.day .lo{color:var(--muted)}

/* news */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 2px}
.tab{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:.8rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.newshead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.newshead .upd{font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--link);cursor:pointer;padding:4px 0;font-size:.85rem}
ol.news{list-style:none;margin:0;padding:0}
ol.news li{padding:8px 0;border-bottom:1px solid var(--line)}
ol.news li:last-child{border-bottom:0}
ol.news a{text-decoration:none;font-weight:500;font-size:.88rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
ol.news a:hover{text-decoration:underline}
ol.news .meta{margin-top:2px;font-size:.72rem;color:var(--muted)}
.state{padding:28px 0;color:var(--muted);text-align:center}
.skel{height:14px;border-radius:7px;background:var(--line);margin:14px 0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.hero,.scene-bg{transition:none}}
.newscard{padding:12px 14px}
.newscard h2{font-size:1rem}
.newscard #news{max-height:360px;overflow-y:auto;overscroll-behavior:contain}
.newscard.folded .tabs,.newscard.folded #news{display:none}
.newscard .newshead .upd{font-size:.72rem}
footer{margin-top:28px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="scene" id="scene">
    <div class="scene-bg"><canvas id="fx" aria-hidden="true"></canvas></div>
  <header class="top">
    <div class="brand">
      <h1>오늘</h1>
      <p id="date"></p>
    </div>
    <div class="finder">
      <input id="q" type="search" placeholder="도시 이름으로 날씨 보기 (예: 부산, Tokyo)" aria-label="도시 검색" autocomplete="off">
      <button class="btn" id="go">검색</button>
      <button class="btn" id="geo" title="현재 위치의 날씨 보기">내 위치</button>
      <div class="results" id="results" role="listbox"></div>
    </div>
  </header>
    <div class="scene-foot">
      <div class="scene-cap" id="sceneCap" aria-live="polite"></div>
      <div class="chips" id="chips" role="group" aria-label="배경 효과 미리보기"></div>
    </div>
  </div>

  <div class="grid">
    <div class="stack">
      <section class="hero" id="hero" aria-live="polite">
        <div class="state" style="opacity:.8">날씨를 불러오는 중…</div>
      </section>
      <section class="card" aria-labelledby="h-air">
        <h2 id="h-air">공기질</h2>
        <div class="air" id="air"><div class="state" style="grid-column:1/-1">불러오는 중…</div></div>
      </section>
      <section class="card" aria-labelledby="h-hour">
        <h2 id="h-hour">시간별 예보</h2>
        <div class="hours" id="hours"></div>
      </section>
      <section class="card" aria-labelledby="h-day">
        <h2 id="h-day">7일 예보</h2>
        <div id="days"></div>
      </section>
    </div>

    <section class="card newscard" id="newscard" aria-labelledby="h-news">
      <div class="newshead">
        <h2 id="h-news" style="margin:0">주요 뉴스</h2>
        <span><span class="upd" id="upd"></span> <button class="linkbtn" id="refresh">새로고침</button> <button class="linkbtn" id="fold" aria-expanded="true" aria-controls="news">접기</button></span>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="news"></div>
    </section>
  </div>

  <footer>날씨: Open-Meteo · 공기질: Open-Meteo Air Quality (CAMS 예측 모델 기반, 관측소 실측값과 다를 수 있음) · 뉴스: Google 뉴스 헤드라인. 기사 원문은 각 언론사에서 확인하세요.</footer>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const DEFAULT_LOC = {name:"서산시", sub:"충청남도", lat:36.7845, lon:126.4503};
let loc = DEFAULT_LOC, saved = null;
try{ const s = JSON.parse(localStorage.getItem("today.loc")||"null"); if(s && s.lat && s.lon){ loc = s; saved = s; } }catch(e){}

/* ---------- utilities ---------- */
function el(tag, attrs, text){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(text!=null) e.textContent = text;
  return e;
}
async function getJSON(url, ms){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms||10000);
  try{
    const r = await fetch(url, {signal:c.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function getText(url, ms){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms||10000);
  try{
    const r = await fetch(url, {signal:c.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}
const DOW = ["일","월","화","수","목","금","토"];
function ymd(s){ const [y,m,d] = s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); }
function r(n){ return Math.round(n); }

$("#date").textContent = new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());

/* ---------- weather codes & icons ---------- */
function wx(code){
  if(code===0) return {label:"맑음",kind:"clear"};
  if(code===1) return {label:"대체로 맑음",kind:"clear"};
  if(code===2) return {label:"구름 조금",kind:"partly"};
  if(code===3) return {label:"흐림",kind:"cloudy"};
  if(code===45||code===48) return {label:"안개",kind:"fog"};
  if(code>=51&&code<=57) return {label:"이슬비",kind:"rain"};
  if(code===66||code===67) return {label:"얼어붙는 비",kind:"rain"};
  if(code>=61&&code<=65) return {label:code>=65?"강한 비":"비",kind:"rain"};
  if(code>=71&&code<=77) return {label:"눈",kind:"snow"};
  if(code>=80&&code<=82) return {label:"소나기",kind:"rain"};
  if(code===85||code===86) return {label:"눈 소나기",kind:"snow"};
  if(code>=95) return {label:"뇌우",kind:"thunder"};
  return {label:"알 수 없음",kind:"cloudy"};
}
const CLOUD = '<path d="M14 36a8 8 0 0 1 1.3-15.9A10.5 10.5 0 0 1 35 22a7 7 0 0 1-.5 14z" fill="#b9c6d2"/>';
function icon(kind, day, size){
  size = size||36;
  let g = "";
  const sun = '<circle cx="24" cy="24" r="8" fill="#f5b942"/>' +
    [0,45,90,135,180,225,270,315].map(a=>`<line x1="24" y1="9" x2="24" y2="13" stroke="#f5b942" stroke-width="3" stroke-linecap="round" transform="rotate(${a} 24 24)"/>`).join("");
  const moon = '<path d="M30 8a15 15 0 1 0 10 26A13 13 0 0 1 30 8z" fill="#e8e2c8"/>';
  if(kind==="clear") g = day ? sun : moon;
  else if(kind==="partly") g = (day ? '<g transform="translate(-6 -6) scale(.8)">'+sun+'</g>' : '<g transform="translate(-4 -6) scale(.8)">'+moon+'</g>') + CLOUD;
  else if(kind==="cloudy") g = CLOUD;
  else if(kind==="fog") g = CLOUD + '<line x1="10" y1="40" x2="38" y2="40" stroke="#b9c6d2" stroke-width="3" stroke-linecap="round"/><line x1="14" y1="45" x2="34" y2="45" stroke="#b9c6d2" stroke-width="3" stroke-linecap="round"/>';
  else if(kind==="rain") g = CLOUD + [16,24,32].map(x=>`<line x1="${x}" y1="39" x2="${x-2}" y2="45" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>`).join("");
  else if(kind==="snow") g = CLOUD + [16,24,32].map(x=>`<circle cx="${x}" cy="42" r="2.2" fill="#8fb8e0"/>`).join("");
  else if(kind==="thunder") g = CLOUD + '<path d="M25 33l-6 9h5l-2 6 8-10h-5z" fill="#f5b942"/>';
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" role="img" aria-hidden="true">${g}</svg>`;
}
const SKY = {
  clearDay:{a:"#5fa9e6",b:"#dcefff",ink:"#0f2437"},
  clearNight:{a:"#141f3b",b:"#33447a",ink:"#eef2fb"},
  cloudy:{a:"#93a6b7",b:"#d9e0e6",ink:"#17232e"},
  rain:{a:"#4f6577",b:"#93a8b6",ink:"#f4f8fb"},
  snow:{a:"#a9bbcf",b:"#eef3f8",ink:"#16232f"},
  thunder:{a:"#353d4f",b:"#6a7389",ink:"#f4f6fa"},
  fog:{a:"#aab3b9",b:"#e3e6e8",ink:"#17232e"}
};
function skyFor(kind, day){
  if(kind==="clear"||kind==="partly") return day? SKY.clearDay : SKY.clearNight;
  return SKY[kind]||SKY.cloudy;
}

/* ---------- weather ---------- */
function gradeFor(v, cuts){
  const names = ["좋음","보통","나쁨","매우 나쁨"], colors = ["#2e8b57","#c99a1c","#d9701f","#c0392b"];
  let i = v<=cuts[0]?0 : v<=cuts[1]?1 : v<=cuts[2]?2 : 3;
  return {name:names[i], color:colors[i], level:i};
}
async function loadWeather(){
  const hero = $("#hero");
  hero.replaceChildren(el("div",{class:"state",style:"opacity:.8"},"날씨를 불러오는 중…"));
  const p = `latitude=${loc.lat}&longitude=${loc.lon}`;
  const wUrl = `https://api.open-meteo.com/v1/forecast?${p}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day`+
    `&hourly=temperature_2m,precipitation_probability,weather_code,is_day`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset`+
    `&timezone=auto&forecast_days=7&wind_speed_unit=ms`;
  const aUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?${p}&current=pm10,pm2_5&timezone=auto`;
  const [w, a] = await Promise.allSettled([getJSON(wUrl), getJSON(aUrl)]);
  if(w.status!=="fulfilled"){
    hero.replaceChildren(el("div",{class:"state",style:"opacity:.9"},"날씨 정보를 가져오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요."));
    return;
  }
  renderWeather(w.value);
  renderAir(a.status==="fulfilled" ? a.value : null);
}
function renderWeather(d){
  const c = d.current, dy = d.daily;
  const day = c.is_day===1;
  const info = wx(c.weather_code);
  const sky = skyFor(info.kind, day);
  Scene.setLive({kind:info.kind, day:day, wind:c.wind_speed_10m||0, heavy:[63,65,81,82,95,96,99].indexOf(c.weather_code)>=0});
  const hero = $("#hero");
  hero.style.setProperty("--sky-a", sky.a);
  hero.style.setProperty("--sky-b", sky.b);
  hero.style.setProperty("--hero-ink", sky.ink);

  const hi = r(dy.temperature_2m_max[0]), lo = r(dy.temperature_2m_min[0]);
  const rain = dy.precipitation_probability_max[0];
  const uv = dy.uv_index_max[0];

  // one-line advice
  const tips = [];
  if(rain>=60) tips.push("우산을 챙기세요");
  else if(rain>=30) tips.push("비 올 가능성이 있어 접이식 우산이 있으면 좋아요");
  if(hi-lo>=10) tips.push("일교차가 크니 겉옷을 준비하세요");
  if(hi>=33) tips.push("무더우니 물을 자주 마시세요");
  if(hi<=5) tips.push("추우니 따뜻하게 입으세요");
  if(uv>=6) tips.push("자외선이 강하니 선크림을 바르세요");
  if(!tips.length) tips.push("무난한 하루예요");

  hero.replaceChildren();
  hero.appendChild(el("div",{class:"place"}, loc.name + (loc.sub? " · "+loc.sub : "") + (loc.approx? " · 대략적인 위치" : "")));
  document.title = r(c.temperature_2m)+"° "+info.label+" · "+loc.name;
  const now = el("div",{class:"now"});
  const t = el("div",{class:"temp"}); t.textContent = r(c.temperature_2m); t.appendChild(el("sup",null,"°"));
  const ic = el("div"); ic.innerHTML = icon(info.kind, day, 72);
  now.appendChild(t); now.appendChild(ic);
  hero.appendChild(now);
  hero.appendChild(el("div",{class:"cond"}, info.label));
  hero.appendChild(el("div",{class:"range"}, `최고 ${hi}° / 최저 ${lo}° · 강수확률 ${rain}%`));
  hero.appendChild(el("p",{class:"say"}, tips.join(". ") + "."));

  const facts = el("div",{class:"facts"});
  [["체감",r(c.apparent_temperature)+"°"],["습도",c.relative_humidity_2m+"%"],["바람",c.wind_speed_10m.toFixed(1)+" m/s"],["자외선 최고",uv.toFixed(0)]].forEach(([k,v])=>{
    const box = el("div"); box.appendChild(el("b",null,v)); box.appendChild(document.createTextNode(k)); facts.appendChild(box);
  });
  hero.appendChild(facts);
  hero.appendChild(el("div",{class:"stamp"}, `일출 ${dy.sunrise[0].slice(11,16)} · 일몰 ${dy.sunset[0].slice(11,16)} · 기준 ${c.time.slice(11,16)} (현지 시각)`));

  // hourly
  const hEl = $("#hours"); hEl.replaceChildren();
  const from = c.time.slice(0,13)+":00";
  let s = d.hourly.time.findIndex(x=>x>=from); if(s<0) s=0;
  for(let i=s;i<Math.min(s+24,d.hourly.time.length);i++){
    const h = el("div",{class:"hour"});
    const hh = +d.hourly.time[i].slice(11,13);
    h.appendChild(el("div",{class:"t"}, i===s ? "지금" : hh+"시"));

async function search(){

  const box = $("#results"); box.replaceChildren(el("div",{class:"state",style:"padding:12px"},"검색 중…")); box.classList.add("open");

    box.replaceChildren();
    if(!d.results||!d.results.length){ box.appendChild(el("div",{class:"state",style:"padding:12px"},"검색 결과가 없어요. 다른 이름으로 시도해 보세요.")); return; }

async function reverseName(lat,lon){
  try{
    const d = await getJSON("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=ko", 8000);
    const nm = d.city || d.locality;
    return {name:nm || d.principalSubdivision || "내 위치", sub: nm ? (d.principalSubdivision||"") : ""};
  }catch(e){ return {name:"내 위치", sub:""}; }
}
function gps(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation) return rej(new Error("nogeo"));
    navigator.geolocation.getCurrentPosition(function(p){ res({lat:p.coords.latitude, lon:p.coords.longitude}); }, rej, {timeout:8000, maximumAge:600000});
  });
}
async function byIP(){
  const d = await getJSON("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=ko", 8000);
  if(d.latitude==null || d.longitude==null) throw new Error("noip");
  const nm = d.city || d.locality;
  return {lat:d.latitude, lon:d.longitude, name:nm || d.principalSubdivision || "내 위치", sub: nm ? (d.principalSubdivision||"") : "", auto:true, approx:true};
}
// GPS를 먼저 시도하고, 허용되지 않으면 IP 기반의 대략적인 위치를 사용해요.
async function locate(){
  try{
    const pos = await gps(); const n = await reverseName(pos.lat, pos.lon);
    return {name:n.name, sub:n.sub, lat:pos.lat, lon:pos.lon, auto:true};
  }catch(e){ return await byIP(); }
}
$("#geo").addEventListener("click", async function(){
  const b = $("#geo"); b.disabled = true; b.textContent = "찾는 중…";
  try{ setLoc(await locate()); }
  catch(e){ alert("위치를 찾지 못했어요. 도시 이름으로 검색해 주세요."); }
  b.disabled = false; b.textContent = "내 위치";
});

const BASE = "https://news.google.com/rss";
const Q = "?hl=ko&gl=KR&ceid=KR:ko";
const TABS = [
  {id:"top",   label:"주요",     url:BASE+Q},
  {id:"world", label:"세계",     url:BASE+"/headlines/section/topic/WORLD"+Q},
  {id:"biz",   label:"경제",     url:BASE+"/headlines/section/topic/BUSINESS"+Q},
  {id:"tech",  label:"IT·과학",  url:BASE+"/headlines/section/topic/TECHNOLOGY"+Q}
];
let tab = "top";
const cache = {};

function ago(d){
  const m = Math.floor((Date.now()-d.getTime())/60000);
  if(isNaN(m)||m<0) return "";
  if(m<1) return "방금 전";
  if(m<60) return m+"분 전";
  const h = Math.floor(m/60); if(h<24) return h+"시간 전";
  return Math.floor(h/24)+"일 전";
}
function splitTitle(t){
  const i = t.lastIndexOf(" - ");
  return i>0 ? {title:t.slice(0,i), source:t.slice(i+3)} : {title:t, source:""};
}
async function fetchFeed(url){
  // 1) rss2json (CORS 허용)  2) allorigins 프록시 + XML 파싱
  try{
    const d = await getJSON("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url), 12000);
    if(d.status==="ok" && d.items && d.items.length)
      return d.items.map(x=>({title:x.title, link:x.link, date:new Date((x.pubDate||"").replace(" ","T")+ (x.pubDate&&x.pubDate.indexOf("T")<0?"Z":"")) }));
  }catch(e){}
  const txt = await getText("https://api.allorigins.win/raw?url="+encodeURIComponent(url), 12000);
  const doc = new DOMParser().parseFromString(txt,"text/xml");
  const items = [...doc.querySelectorAll("item")].map(i=>({
    title:(i.querySelector("title")||{}).textContent||"",
    link:(i.querySelector("link")||{}).textContent||"",
    date:new Date((i.querySelector("pubDate")||{}).textContent||"")
  }));
  if(!items.length) throw new Error("empty");
  return items;
}
function drawTabs(){
  const t = $("#tabs"); t.replaceChildren();
  TABS.forEach(x=>{
    const b = el("button",{class:"tab",role:"tab","aria-selected":String(x.id===tab),type:"button"}, x.label);
    b.addEventListener("click",()=>{ tab = x.id; drawTabs(); loadNews(false); });
    t.appendChild(b);
  });
}
async function loadNews(force){
  const box = $("#news"); const cur = TABS.find(x=>x.id===tab);
  if(!force && cache[tab]){ drawNews(cache[tab]); return; }
  box.replaceChildren(); for(let i=0;i<6;i++) box.appendChild(el("div",{class:"skel"}));
  try{
    const items = await fetchFeed(cur.url);
    cache[tab] = {items:items.slice(0,10), at:new Date()};
    if(tab===cur.id) drawNews(cache[tab]);
  }catch(e){
    if(tab!==cur.id) return;
    box.replaceChildren(el("div",{class:"state"},"뉴스를 불러오지 못했어요. 잠시 후 ‘새로고침’을 눌러 주세요."));
    $("#upd").textContent = "";
  }
}
function drawNews(c){
  const box = $("#news"); box.replaceChildren();
  const ol = el("ol",{class:"news"});
  c.items.forEach(it=>{
    const {title,source} = splitTitle(it.title);
    const li = el("li");
    const a = el("a",{target:"_blank",rel:"noopener noreferrer"}, title);
    try{ const u = new URL(it.link); if(u.protocol==="https:"||u.protocol==="http:") a.setAttribute("href", u.href); }catch(e){}
    li.appendChild(a);
    const meta = [source, ago(it.date)].filter(Boolean).join(" · ");
    if(meta) li.appendChild(el("div",{class:"meta"}, meta));
    ol.appendChild(li);
  });
  box.appendChild(ol);
  $("#upd").textContent = c.at.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) + " 갱신";
}

/* ---------- scene: animated banner at the top of the page ---------- */
const Scene = (function(){
  const scene = $("#scene"), cv = $("#fx"), ctx = cv.getContext("2d");
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const WIND_MIN = 4; // m/s 이상이면 벚꽃잎이 날려요
  let W=0, H=0, mode=null, live=null, preview="live", raf=0, last=0, visible=true, flash=0, nextFlash=0;
  let clouds=[], stars=[], motes=[], drops=[], ripples=[], flakes=[], petals=[];
  const rnd = (a,b)=>a+Math.random()*(b-a);
  const PETAL = ["#ffc9d9","#ffb5ca","#ffdde8","#ffa9c2"];
  const PREVIEWS = [
    {id:"live",   label:"실제 날씨"},
    {id:"sakura", label:"벚꽃", m:{kind:"clear",day:true,wind:7}},
    {id:"rain",   label:"비",   m:{kind:"rain",day:true,wind:2,heavy:false}},
    {id:"sun",    label:"맑음", m:{kind:"clear",day:true,wind:1}},
    {id:"cloud",  label:"흐림", m:{kind:"cloudy",day:true,wind:2}},
    {id:"snow",   label:"눈",   m:{kind:"snow",day:true,wind:1}},
    {id:"night",  label:"밤",   m:{kind:"clear",day:false,wind:1}}
  ];

  function resize(){
    const b = scene.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = b.width; H = b.height;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    build(); if(reduce) draw(0,0);
  }
  function isWindy(m){ return (m.wind||0) >= WIND_MIN && m.kind!=="rain" && m.kind!=="thunder" && m.kind!=="snow"; }

  function build(){
    clouds=[]; stars=[]; motes=[]; drops=[]; ripples=[]; flakes=[]; petals=[];
    if(!mode || !W) return;
    const k = mode.kind, day = mode.day, wind = mode.wind||0;
    const dark = (k==="rain"||k==="thunder");
    let n=0, a=.5, sz=[1,1.6];
    if(k==="partly"){n=3;a=.75}
    else if(k==="cloudy"){n=6;a=.7}
    else if(k==="fog"){n=8;a=.4;sz=[1.6,2.4]}
    else if(dark){n=6;a=.8}
    else if(k==="snow"){n=5;a=.6}
    else if(k==="clear"&&day){n=1;a=.3}
    const unit = Math.max(W,420)/700;
    for(let i=0;i<n;i++) clouds.push({x:rnd(-100,W),y:k==="fog"?rnd(H*.3,H*.9):rnd(H*.04,H*.45),s:rnd(sz[0],sz[1])*unit,v:rnd(.6,1.4)*(.15+wind*.06),a:a*rnd(.75,1)});
    if((k==="clear"||k==="partly") && !day){
      const c = k==="clear"?70:30;
      for(let i=0;i<c;i++) stars.push({x:rnd(0,W),y:rnd(0,H*.8),r:rnd(.5,1.6),ph:rnd(0,6.28)});
    }
    if((k==="clear"||k==="partly") && day){
      for(let i=0;i<26;i++) motes.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,2.8),v:rnd(.08,.3),ph:rnd(0,6.28)});
    }
    if(dark){
      const c = Math.round((mode.heavy?140:70)*Math.max(W,420)/900);
      for(let i=0;i<c;i++) drops.push({x:rnd(-60,W),y:rnd(-H,H),len:rnd(8,17),v:rnd(9,14),o:rnd(.25,.6)});
    } else if(k==="snow"){
      for(let i=0;i<Math.round(80*Math.max(W,420)/900);i++) flakes.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1.5,3.6),v:rnd(.5,1.3),ph:rnd(0,6.28)});
    } else if(isWindy(mode)){
      const c = Math.max(18, Math.min(80, Math.round((22+wind*5)*Math.max(W,420)/900)));
      for(let i=0;i<c;i++) petals.push({x:rnd(-40,W),y:rnd(-20,H),s:rnd(5,9.5),rot:rnd(0,6.28),vr:rnd(-.05,.05),ph:rnd(0,6.28),fl:rnd(0,6.28),vy:rnd(0,.7),k:rnd(.7,1.3),o:rnd(.75,1),c:PETAL[(Math.random()*PETAL.length)|0]});
    }
  }

  function puff(x,y,r,col,a){
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,"rgba("+col+","+a+")"); g.addColorStop(1,"rgba("+col+",0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  function cloud(c,col){
    const u = 30*c.s;
    [[-1.1,.15,1.1],[-.4,-.3,1.4],[.5,-.2,1.3],[1.2,.15,1.0],[.1,.3,1.5]].forEach(function(p){ puff(c.x+p[0]*u, c.y+p[1]*u, p[2]*u, col, c.a); });
  }
  function petalPath(s){
    ctx.beginPath();
    ctx.moveTo(0,-s*.85);
    ctx.bezierCurveTo(s*.9,-s*1.15, s*.95,s*.3, 0,s);
    ctx.bezierCurveTo(-s*.95,s*.3, -s*.9,-s*1.15, 0,-s*.85);
    ctx.closePath();
  }

  function drawSun(t){
    const cx=W*.72, cy=H*.55, R=Math.min(W,H)*.1;
    const len = Math.max(W,H)*1.3;
    let g = ctx.createRadialGradient(cx,cy,0,cx,cy,R*7);
    g.addColorStop(0,"rgba(255,244,190,.9)"); g.addColorStop(.25,"rgba(255,226,130,.32)"); g.addColorStop(1,"rgba(255,220,120,0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    g = ctx.createRadialGradient(cx,cy,R,cx,cy,len);
    g.addColorStop(0,"rgba(255,248,214,.30)"); g.addColorStop(1,"rgba(255,248,214,0)");
    ctx.fillStyle=g;
    for(let i=0;i<12;i++){
      const a = t*.00004 + i*(Math.PI*2/12), w = .06+.025*Math.sin(t*.0008+i*1.7);
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a-w)*len, cy+Math.sin(a-w)*len);
      ctx.lineTo(cx+Math.cos(a+w)*len, cy+Math.sin(a+w)*len);
      ctx.closePath(); ctx.fill();
    }
    const rr = R*(1+.02*Math.sin(t*.002));
    g = ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
    g.addColorStop(0,"#fffbe0"); g.addColorStop(1,"#ffd45c");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.fill();
  }
  function drawNight(t){
    const cx=W*.74, cy=H*.42, R=Math.min(W,H)*.07;
    stars.forEach(function(s){
      ctx.fillStyle="rgba(255,255,240,"+(.35+.6*Math.abs(Math.sin(t*.0012+s.ph)))+")";
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    });
    const g = ctx.createRadialGradient(cx,cy,R*.6,cx,cy,R*5);
    g.addColorStop(0,"rgba(240,236,205,.45)"); g.addColorStop(1,"rgba(240,236,205,0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#f4efd8"; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
  }

  function draw(t,dt){
    ctx.clearRect(0,0,W,H);
    if(!mode || !W) return;
    const k=mode.kind, day=mode.day, wind=mode.wind||0;
    if((k==="clear"||k==="partly") && day) drawSun(t);
    if((k==="clear"||k==="partly") && !day) drawNight(t);
    const col = (k==="rain"||k==="thunder") ? "62,76,90" : (!day ? "150,165,205" : "255,255,255");
    clouds.forEach(function(c){
      c.x += c.v*dt; if(c.x-200*c.s > W) c.x = -220*c.s;
      cloud(c,col);
    });
    motes.forEach(function(m){
      m.y -= m.v*dt; m.x += Math.sin(m.ph+t*.001)*.15*dt;
      if(m.y<-8){ m.y=H+8; m.x=rnd(0,W); }
      ctx.fillStyle="rgba(255,250,222,"+(.25+.4*Math.abs(Math.sin(t*.002+m.ph)))+")";
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,7); ctx.fill();
    });
    // rain
    if(drops.length){
      const vx = .8+wind*.5;
      ctx.lineWidth=1.2; ctx.lineCap="round";
      drops.forEach(function(d){
        d.y += d.v*dt; d.x += vx*.8*dt;
        if(d.y>H){ if(Math.random()<.12) ripples.push({x:d.x,y:H-rnd(4,26),r:1,a:.5}); d.y=rnd(-40,-5); d.x=rnd(-60,W); }
        if(d.x>W+20) d.x=-20;
        const hy=Math.hypot(vx,d.v);
        ctx.strokeStyle="rgba(215,232,248,"+d.o+")";
        ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-vx/hy*d.len, d.y-d.v/hy*d.len); ctx.stroke();
      });
      ripples = ripples.filter(function(r){ r.r+=.5*dt; r.a-=.012*dt; return r.a>0; });
      ripples.forEach(function(r){
        ctx.strokeStyle="rgba(230,240,250,"+r.a+")"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*.35,0,0,7); ctx.stroke();
      });
      if(k==="thunder"){
        if(t>nextFlash){ flash=1; nextFlash=t+rnd(3500,9000); }
        if(flash>0){ ctx.fillStyle="rgba(255,255,255,"+(flash*.55)+")"; ctx.fillRect(0,0,W,H); flash-=.05*dt; }
      }
    }
    // snow
    flakes.forEach(function(f){
      f.ph+=.02*dt; f.y+=f.v*dt; f.x+=(Math.sin(f.ph)*.5+wind*.3)*dt;
      if(f.y>H+5){ f.y=-5; f.x=rnd(0,W); } if(f.x>W+5) f.x=-5;
      ctx.fillStyle="rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
    });
    // cherry blossom petals
    petals.forEach(function(p){
      p.ph+=.035*dt; p.fl+=.05*dt; p.rot+=p.vr*dt;
      p.x += (.5+wind*.5 + Math.sin(p.ph)*.8)*dt*p.k;
      p.y += (.6+p.vy + Math.cos(p.ph*.7)*.3)*dt;
      if(p.x>W+30 || p.y>H+30){
        if(Math.random()<.6){ p.x=-20; p.y=rnd(-20,H*.8); } else { p.x=rnd(-40,W); p.y=-20; }
      }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.scale(.7, .3+.7*Math.abs(Math.cos(p.fl)));
      ctx.globalAlpha=p.o; ctx.fillStyle=p.c; petalPath(p.s); ctx.fill();
      ctx.restore();
    });
  }

  function frame(t){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(Math.max((t-last)/16.67,0),3) || 1; last = t;
    draw(t,dt);
  }
  function start(){ if(reduce){ draw(0,0); return; } if(!raf && visible){ last=performance.now(); raf=requestAnimationFrame(frame); } }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }

  function caption(m, isLive){
    const k=m.kind; let t;
    if(k==="thunder") t="천둥번개가 쳐요";
    else if(k==="rain") t=m.heavy?"비가 내려요":"가랑비가 내려요";
    else if(k==="snow") t="눈이 내려요";
    else if(isWindy(m)) t="바람에 벚꽃잎이 날려요";
    else if(k==="fog") t="안개가 짙어요";
    else if(k==="cloudy") t="구름이 천천히 흘러가요";
    else if(k==="partly") t=m.day?"구름 사이로 햇살이 비쳐요":"구름 낀 밤이에요";
    else t=m.day?"햇살이 가득해요":"맑은 밤이에요";
    if(isLive && m.wind!=null) t += " · 바람 "+m.wind.toFixed(1)+" m/s";
    return t;
  }
  function apply(){
    let m = live, isLive = true;
    if(preview!=="live"){ m = PREVIEWS.filter(function(x){return x.id===preview;})[0].m; isLive = false; }
    if(!m) return;
    mode = m;
    const sky = skyFor(m.kind, m.day);
    scene.style.setProperty("--scene-a", sky.a);
    scene.style.setProperty("--scene-b", sky.b);
    scene.style.setProperty("--scene-ink", sky.ink);
    document.documentElement.style.setProperty("--tint", sky.a);
    $("#sceneCap").textContent = caption(m, isLive);
    build(); start(); if(reduce) draw(0,0);
  }
  function drawChips(){
    const box = $("#chips"); box.replaceChildren();
    PREVIEWS.forEach(function(x){
      const b = el("button",{class:"chip",type:"button","aria-pressed":String(x.id===preview)}, x.label);
      b.addEventListener("click", function(){ preview = x.id; drawChips(); apply(); });
      box.appendChild(b);
    });
  }
  function setLive(m){ live = m; if(preview==="live") apply(); }

  if("ResizeObserver" in window) new ResizeObserver(function(){ resize(); }).observe(scene);
  else window.addEventListener("resize", resize);
  if("IntersectionObserver" in window) new IntersectionObserver(function(es){
    visible = es[0].isIntersecting; if(visible) start(); else stop();
  }).observe(scene);
  drawChips(); resize();
  return {setLive:setLive};
})();

/* ---------- init ---------- */
drawTabs();
loadNews(false);
if(!saved){
  // 처음 방문: 현지 위치를 찾은 뒤 그 지역 날씨를 보여줘요.
  $("#hero").replaceChildren(el("div",{class:"state",style:"opacity:.8"},"현지 위치를 찾는 중…"));
  locate().then(setLoc).catch(function(){ loadWeather(); });
}else{
  loadWeather();
  // 자동으로 잡은 위치라면 다시 확인해서 이동했을 때 따라가요.
  if(saved.auto) locate().then(function(l){
    if(Math.abs(l.lat-loc.lat)>.05 || Math.abs(l.lon-loc.lon)>.05) setLoc(l);
  }).catch(function(){});
}
// 30분마다 자동 갱신
setInterval(()=>{ loadWeather(); delete cache[tab]; loadNews(true); }, 30*60*1000);
})();
</script>
